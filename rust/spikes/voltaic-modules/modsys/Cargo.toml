[package]
name = "modsys"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "S1b spike: typed options, a read/write DAG, a lazy fixpoint, a pure id_effect evaluation and ATerm .drv emission"
build = "build.rs"

[dependencies]
# One id_effect version per build, pinned exactly like every consumer.
id_effect = { version = "=0.13.0", default-features = false }
# Store paths, nix32 and sha256: the primitives the .drv emitter needs.
nix-store-core = { path = "../../../tools/nix-store-core" }

[build-dependencies]
voltaic-driver = "=0.3.0"
voltaic-diag = "=0.3.0"
