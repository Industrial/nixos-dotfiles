# The purity fence for configuration code. id_effect's `R` tracks the
# capabilities an effect asks for, not ambient authority: a `suspend` at
# `R = HNil` can still touch the filesystem. So configuration crates deny
# std's IO surface outright, and CI runs clippy with `-D clippy::disallowed_methods
# -D clippy::disallowed_types`. A pinned fetch goes through the `Fetch`
# capability (modsys::pure), never through these.
disallowed-methods = [
  { path = "std::fs::read", reason = "configuration is pure; use the Fetch capability" },
  { path = "std::fs::read_to_string", reason = "configuration is pure; use the Fetch capability" },
  { path = "std::fs::write", reason = "configuration is pure" },
  { path = "std::fs::read_dir", reason = "configuration is pure" },
  { path = "std::fs::metadata", reason = "configuration is pure" },
  { path = "std::fs::File::open", reason = "configuration is pure" },
  { path = "std::fs::File::create", reason = "configuration is pure" },
  { path = "std::process::Command::new", reason = "configuration is pure" },
  { path = "std::env::var", reason = "configuration is pure: no ambient environment" },
  { path = "std::env::var_os", reason = "configuration is pure: no ambient environment" },
  { path = "std::env::vars", reason = "configuration is pure: no ambient environment" },
  { path = "std::time::SystemTime::now", reason = "configuration is pure: no clock" },
  { path = "std::net::TcpStream::connect", reason = "configuration is pure" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "configuration is pure" },
  { path = "std::fs::OpenOptions", reason = "configuration is pure" },
  { path = "std::net::TcpStream", reason = "configuration is pure" },
  { path = "std::net::UdpSocket", reason = "configuration is pure" },
  { path = "std::process::Command", reason = "configuration is pure" },
]
