[package]
name = "assay"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "Assay — Nix unit testing: claim algebra + isolated eval runner"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[lib]
name = "assay"
path = "src/lib/mod.rs"

[[bin]]
name = "assay"
path = "src/main.rs"
