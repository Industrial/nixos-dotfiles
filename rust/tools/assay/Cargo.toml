[package]
name = "assay"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "Assay — Nix unit testing: claim algebra + isolated eval runner"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
proptest = { version = "1", optional = true }
# id_effect: local path pin (D1). Override via patch or ID_EFFECT_PATH later.
id_effect = { path = "/data/Code/rust/id_effect/crates/id_effect", features = ["schema-serde"] }
id_effect_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_macro" }
id_effect_proc_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_proc_macro" }
id_effect_cli = { path = "/data/Code/rust/id_effect/crates/id_effect_cli", optional = true }
id_effect_process = { path = "/data/Code/rust/id_effect/crates/id_effect_process", optional = true }
id_effect_optics = { path = "/data/Code/rust/id_effect/crates/id_effect_optics", optional = true }

[features]
default = ["cli-exit", "optics"]
cli-exit = ["dep:id_effect_cli"]
process-pool = ["dep:id_effect_process"]
optics = ["dep:id_effect_optics"]
proptest = ["id_effect/proptest", "dep:proptest"]

[lib]
name = "assay"
path = "src/lib/mod.rs"

[[bin]]
name = "assay"
path = "src/main.rs"
