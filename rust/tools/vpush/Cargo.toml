[package]
name = "vpush"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "Push locally built Nix store paths to the fleet's vcache host over the nix-daemon worker protocol (post-build-hook + spool daemon)"
license = "MIT"
build = "build.rs"

# Standalone crate: its own Cargo.lock for buildRustPackage, and no shared
# rust/Cargo.lock with the other rust/tools/* in flight.
[workspace]

[dependencies]
# One id_effect version per build (types do not unify): pinned exactly, like
# nix-store-core and every other consumer.
id_effect = "=0.13.0"
id_effect_cli = "=0.13.0"
# The store primitives: the store database (closures, path info), narinfo
# fingerprints, signing, and the daemon worker protocol client. default.nix
# roots its source at rust/tools so the path resolves.
nix-store-core = { path = "../nix-store-core" }
# The connection type; the same version nix-store-core's db opens.
rusqlite = { version = "0.37", features = ["bundled"] }
# `ssh <cache> nix-daemon --stdio` as a child process, its pipes handed to the
# worker client; the child is shared behind tokio's mutex.
tokio = { version = "1", features = ["process", "io-util", "sync"] }

# Voltaic as a library: build.rs compiles src/*.vlt into OUT_DIR. Pinned
# exactly; 0.2.0 has silent miscompiles that 0.2.1 fixes.
[build-dependencies]
voltaic-driver = "=0.3.0"
voltaic-diag = "=0.3.0"

[lib]
name = "vpush"
path = "src/lib.rs"

[[bin]]
name = "vpush"
path = "src/main.rs"
