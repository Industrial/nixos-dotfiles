[package]
name = "vcache"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "A Nix binary cache server (narinfo + NAR over HTTP) that reads the local store read-only"
license = "MIT"
build = "build.rs"

# Standalone crate: its own Cargo.lock for buildRustPackage, and no shared
# rust/Cargo.lock with the other rust/tools/* in flight.
[workspace]

[dependencies]
axum = "0.8.9"
# One id_effect version per build (types do not unify): pinned exactly, like
# rust/Cargo.toml's [workspace.dependencies] and nix-store-core.
id_effect = "=0.13.0"
id_effect_axum = "=0.13.0"
id_effect_cli = "=0.13.0"
id_effect_config = "=0.13.0"
# The store primitives (store paths, nix32, NAR, narinfo, signing, the store
# database). default.nix roots its source at rust/tools so the path resolves.
nix-store-core = { path = "../nix-store-core" }
# The pooled connections' type; the same version nix-store-core's db opens.
rusqlite = { version = "0.37", features = ["bundled"] }

# Voltaic as a library: build.rs compiles src/*.vlt into OUT_DIR. Pinned
# exactly; 0.2.0 has silent miscompiles that 0.2.1 fixes.
[build-dependencies]
voltaic-driver = "=0.3.0"
voltaic-diag = "=0.3.0"

[lib]
name = "vcache"
path = "src/lib.rs"

[[bin]]
name = "vcache"
path = "src/main.rs"
