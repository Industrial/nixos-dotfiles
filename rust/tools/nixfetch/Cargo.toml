[package]
name = "nixfetch"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "nixfetch — fixed-output fetchurl/fetchgit download + flat/NAR hash verify"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
nixdrv = { path = "../nixdrv" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
id_effect = { path = "/data/Code/rust/id_effect/crates/id_effect", features = [
  "schema-serde",
] }
id_effect_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_macro" }
id_effect_proc_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_proc_macro" }
id_effect_cli = { path = "/data/Code/rust/id_effect/crates/id_effect_cli", optional = true }

[features]
default = ["cli-exit"]
cli-exit = ["dep:id_effect_cli"]

[lib]
name = "nixfetch"
path = "src/lib/mod.rs"

[[bin]]
name = "nixfetch"
path = "src/main.rs"
