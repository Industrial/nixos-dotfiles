[package]
name = "nixdrv"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "nixdrv — derivation ATerm/JSON parse, project outs/inputs, CA store-path helpers"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
hex = "0.4"
rstest = "0.23"
nixq = { path = "../nixq" }
id_effect = { path = "/data/Code/rust/id_effect/crates/id_effect", features = [
  "schema-serde",
] }
id_effect_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_macro" }
id_effect_proc_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_proc_macro" }
id_effect_cli = { path = "/data/Code/rust/id_effect/crates/id_effect_cli", optional = true }

[features]
default = ["cli-exit"]
cli-exit = ["dep:id_effect_cli"]

[lib]
name = "nixdrv"
path = "src/lib/mod.rs"

[[bin]]
name = "nixdrv"
path = "src/main.rs"
