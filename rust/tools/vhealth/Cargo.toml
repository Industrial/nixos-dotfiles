[package]
name = "vhealth"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "Service health probes (TCP, HTTP, unix socket, command, file freshness) run concurrently with timeouts, as a CLI, a library and a node_exporter textfile daemon"
license = "MIT"
build = "build.rs"

# Standalone crate: its own Cargo.lock for buildRustPackage, and no shared
# rust/Cargo.lock with the other rust/tools/* in flight.
[workspace]

[dependencies]
# One id_effect version per build (types do not unify): pinned exactly, like
# every other rust/tools consumer.
id_effect = "=0.13.0"
id_effect_cli = "=0.13.0"
# The probes' I/O: sockets and child processes as futures, so a probe's
# timeout (an id_effect race) drops the connection or kills the child.
# id_effect already runs its fibers on tokio; these are only extra features.
tokio = { version = "1", features = ["io-util", "net", "process"] }
# The probe configuration (JSON written by features/nix/vhealth) and the report.
serde_json = "1"

# Voltaic as a library: build.rs compiles src/*.vlt into OUT_DIR. Pinned
# exactly; 0.2.0 has silent miscompiles that 0.2.1 fixes.
[build-dependencies]
voltaic-driver = "=0.3.0"
voltaic-diag = "=0.3.0"

[lib]
name = "vhealth"
path = "src/lib.rs"

[[bin]]
name = "vhealth"
path = "src/main.rs"
