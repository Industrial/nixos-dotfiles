[package]
name = "vdaemon-proxy"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "A logging proxy in front of nix-daemon: every worker-protocol op as one JSON line"
license = "MIT"
build = "build.rs"

# Standalone crate: its own Cargo.lock for buildRustPackage, and no shared
# rust/Cargo.lock with the other rust/tools/* in flight.
[workspace]

[dependencies]
# One id_effect version per build (types do not unify): pinned exactly, like
# nix-store-core and vcache.
id_effect = "=0.13.0"
id_effect_cli = "=0.13.0"
id_effect_config = "=0.13.0"
# The raw per-thread setresuid/setfsuid calls that let the upstream connection
# carry the client's uid (src/upstream.vlt).
libc = "0.2"
# The worker protocol's grammar (nix_store_core::worker). default.nix roots its
# source at rust/tools so the path resolves.
nix-store-core = { path = "../nix-store-core" }
# Native answers (src/native.vlt, src/conform.vlt): the store database, read-only,
# through nix-store-core's own rusqlite (bundled SQLite), and the SHA-256 of a NAR
# as the daemon streams it. Both are already in nix-store-core's tree.
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
# The NAR chunks nix_store_core::nar::stream yields (native NarFromPath).
bytes = "1"
# sync: the client's write half, shared by the relay and native answers.
tokio = { version = "1", features = ["io-util", "net", "sync"] }

# Voltaic as a library: build.rs compiles src/*.vlt into OUT_DIR. Pinned
# exactly; 0.2.0 has silent miscompiles that 0.2.1 fixes.
[build-dependencies]
voltaic-driver = "=0.3.0"
voltaic-diag = "=0.3.0"

[lib]
name = "vdaemon_proxy"
path = "src/lib.rs"

[[bin]]
name = "vdaemon-proxy"
path = "src/main.rs"
