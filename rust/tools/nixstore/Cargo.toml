[package]
name = "nixstore"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "nixstore — read-only Nix store path-info from db.sqlite"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
id_effect = { path = "/data/Code/rust/id_effect/crates/id_effect", features = [
  "schema-serde",
] }
id_effect_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_macro" }
id_effect_proc_macro = { path = "/data/Code/rust/id_effect/crates/id_effect_proc_macro" }
id_effect_cli = { path = "/data/Code/rust/id_effect/crates/id_effect_cli", optional = true }

[features]
default = ["cli-exit"]
cli-exit = ["dep:id_effect_cli"]

[lib]
name = "nixstore"
path = "src/lib/mod.rs"

[[bin]]
name = "nixstore"
path = "src/main.rs"
