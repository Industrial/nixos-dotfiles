[package]
name = "bifrost"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "NixOS fleet command center built with Iced"
license = "MIT"

[dependencies]
# UI
iced = { version = "0.14", features = ["tokio", "wgpu"] }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP (Prometheus API)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# SSH - using subprocess for now, russh for future async support
# russh = "0.50.0-beta.7"
# russh-keys = "0.50.0-beta.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = "0.4"

# Error handling
thiserror = "2"

# Home directory
dirs = "5"

[lib]
name = "bifrost"
path = "src/lib/mod.rs"

[[bin]]
name = "bifrost"
path = "src/main.rs"
