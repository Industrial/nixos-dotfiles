[package]
name = "vlocate"
version = "0.1.1"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "Where a command comes from: the fleet's own systems (from the store database), nixpkgs (nix-locate's prebuilt database), and a command-not-found hint for nushell, fish and zsh (GH-245)"
license = "MIT"
build = "build.rs"

# Standalone crate: its own Cargo.lock for buildRustPackage, and no shared
# rust/Cargo.lock with the other rust/tools/* in flight.
[workspace]

[dependencies]
# One id_effect version per build (types do not unify): pinned exactly.
id_effect = "=0.13.0"
id_effect_cli = "=0.13.0"
# The closures of this host's and the fleet's systems, from the store database.
# default.nix roots its source at rust/tools so the path resolves.
nix-store-core = { path = "../nix-store-core" }
# The connection type nix-store-core's db opens; the same version.
rusqlite = { version = "0.37", features = ["bundled"] }
# `--json`.
serde_json = "1"

# Voltaic as a library: build.rs compiles src/*.vlt into OUT_DIR. Pinned
# exactly (never 0.2.0: it miscompiles).
[build-dependencies]
voltaic-driver = "=0.3.0"
voltaic-diag = "=0.3.0"

[lib]
name = "vlocate"
path = "src/lib.rs"

[[bin]]
name = "vlocate"
path = "src/main.rs"
