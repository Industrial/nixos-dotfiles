[package]
name = "oomkiller"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "A daemon that monitors system memory and kills the highest memory-consuming process when memory usage exceeds 90%"

build = "build.rs"

[dependencies]
sysinfo = "0.31"

# Voltaic as a library: build.rs compiles src/*.vlt to Rust. The published
# crates ship their generated Rust, so no voltaic binary or bootstrap is needed.
# Pinned exactly: the compiler decides what this daemon kills, and 0.2.0 has
# silent miscompiles that 0.2.1 fixes. Bump deliberately, re-running the tests.
[build-dependencies]
voltaic-driver = "=0.2.1"
voltaic-diag = "=0.2.1"

[lib]
name = "oomkiller"
path = "src/lib.rs"

[[bin]]
name = "oomkiller"
path = "src/main.rs"
