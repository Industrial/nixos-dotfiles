[workspace]
resolver = "3"

# `tools/nixos-update-notifier` is deliberately absent: it carries its own
# Cargo.lock plus an empty [workspace] table so buildRustPackage vendors it
# standalone. Adding it here would break that hashing — see
# rust/tools/TESTING.md and the fleet-rust-tooling skill.
members = ["tools/oomkiller"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Industrial <tom.wieland@gmail.com>"]

[workspace.dependencies]
# No consumer yet — nix-hash was the last one and is gone. Staged here for the
# oomkiller / nixos-update-notifier adoption, because id_effect must be pinned
# in exactly one place: types from two id_effect versions do not unify, so
# every member has to resolve to the same one. Bump here, never in a member.
id_effect = { version = "0.13", features = ["schema-serde"] }
id_effect_cli = "0.13"
