[workspace]
resolver = "3"

# `tools/nixos-update-notifier` is deliberately absent: it carries its own
# Cargo.lock plus an empty [workspace] table so buildRustPackage vendors it
# standalone. Adding it here would break that hashing — see
# rust/tools/TESTING.md and the fleet-rust-tooling skill.
members = ["tools/oomkiller"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Industrial <tom.wieland@gmail.com>"]

[workspace.dependencies]
# id_effect is pinned in exactly one version: types from two id_effect versions
# do not unify, so every member has to resolve to the same one. Bump here.
# Default features are off (they pull rayon, a second sysinfo and clap); a
# member turns on what it uses. oomkiller is also built standalone by its flake
# input, so it cannot say `workspace = true` and repeats this pin — keep the two equal.
id_effect = { version = "=0.13.0", default-features = false }
id_effect_cli = { version = "=0.13.0", default-features = false }
