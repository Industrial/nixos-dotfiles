# Shared Industrial features: `.cursor/nix` (cursor-setup submodule).
# Project-only flake inputs stay here.
imports:
  - ./.cursor/nix

inputs:
  assay:
    url: github:Industrial/assay
  definitively:
    url: github:Industrial/definitively/definitively-v0.4.1
    flake: true
    inputs:
      nixpkgs:
        follows: nixpkgs
      nixpkgs-unstable:
        follows: nixpkgs-unstable
  fenix:
    url: github:nix-community/fenix
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-unstable:
    url: github:NixOS/nixpkgs/nixos-unstable
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs

nixConfig:
  git-ignore-untracked = true
  extra-trusted-public-keys = "nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7BKqP7YhK1i3JvGvscqg5k="
