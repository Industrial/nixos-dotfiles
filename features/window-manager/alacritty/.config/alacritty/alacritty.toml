# No [shell] override — Alacritty runs $SHELL (login shell / user preference).
# Prefer `nu` via chsh / users.users.<name>.shell when ready; do not hardcode fish.

[window]
opacity = 0.85
padding = { x = 8, y = 8 }

[font]
normal.family = "IosevkaTerm Nerd Font Mono"
normal.style = "Regular"
bold.style = "Bold"
italic.style = "Italic"
size = 19.0
