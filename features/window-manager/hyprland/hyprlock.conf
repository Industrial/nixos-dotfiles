# Hyprlock configuration - Gruvbox Dark Hard theme
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(1d2021ff)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(fabd2fff)
    inner_color = rgba(282828ff)
    font_color = rgba(ebdbb2ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ebdbb2ff)
    font_size = 72
    font_family = IosevkaTerm Nerd Font Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(fabd2fff)
    font_size = 24
    font_family = IosevkaTerm Nerd Font Mono
    position = 0, -20
    halign = center
    valign = center
}
