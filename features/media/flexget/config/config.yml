# FlexGet automation config — repo-owned, embedded into the nix store by
# the module. Sources: Jackett torznab endpoints; targets: Transmission RPC.
#
# NOTE: this is a minimal working skeleton. Replace CHANGE-JACKETT-KEY with
# Jackett's API key (shown in its UI after first boot) and curate the
# series/movie filters before expecting useful automation.
web_server:
  bind: 0.0.0.0
  port: 5050
  web_ui: yes
  base_url: /

schedules:
  - tasks: [tv, movies]
    schedule:
      hour: "*/6"
      minute: 15

tasks:
  tv:
    rss:
      url: http://127.0.0.1:9117/torznab/all/api?apikey=CHANGE-JACKETT-KEY&cat=5030,5040
      all_entries: no
    series:
      - example-show
    transmission:
      host: 127.0.0.1
      port: 9091

  movies:
    rss:
      url: http://127.0.0.1:9117/torznab/all/api?apikey=CHANGE-JACKETT-KEY&cat=2000,2045
      all_entries: no
    accept_all: no
    transmission:
      host: 127.0.0.1
      port: 9091
