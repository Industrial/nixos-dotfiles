# id-hermes-superpowers — Superpowers skill pack plugin for Hermes Agent
# https://github.com/obra/superpowers
#
# Skills are sourced from the upstream repo pinned in package.nix via
# fetchFromGitHub and symlinked into ~/.hermes/skills/superpowers/ at
# session start by the on_session_start hook.
#
# Tools and additional hooks are stubs — to be implemented as workflows
# are designed.

name: id-hermes-superpowers
version: 0.1.0
description: >
  Superpowers agentic development workflows for Hermes Agent.
  Provides brainstorming, plan writing, plan execution, code review,
  systematic debugging, TDD, and subagent-driven development as native tools.
  Skills from the upstream obra/superpowers repo are symlinked into
  ~/.hermes/skills/superpowers/ at session start.
author: ""
homepage: https://github.com/obra/superpowers

# Tools registered via ctx.register_tool() in __init__.py
# Populated as workflows are implemented.
provides_tools: []

# Lifecycle hooks registered via ctx.register_hook() in __init__.py
provides_hooks:
  - on_session_start  # symlinks upstream skills into ~/.hermes/skills/superpowers/
