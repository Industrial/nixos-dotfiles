$schema: 'https://moonrepo.dev/schemas/project.json'
id: 'dotfiles'
language: 'bash'
tasks:
  format:
    command: 'treefmt'
  test:
    description: 'Run Assay on all *.assay.nix suites across the repository'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'assay'
      - 'run'
      - '.'
    inputs:
      - '**/*.assay.nix'
      - '**/*.assay.json'
      - 'common/assay/**/*'
      - 'common/**/*.nix'
      - 'rust/tools/assay/src/**/*'
      - 'rust/tools/assay/Cargo.toml'
      - 'rust/tools/nixq/src/**/*'
      - 'rust/tools/nixq/Cargo.toml'
      - 'rust/tools/nixdrv/src/**/*'
      - 'rust/tools/nixdrv/Cargo.toml'
    options:
      # Whole-repo discovery; do not treat as always-cacheable across env changes.
      cache: true
  coverage:
    description: 'Assay crate llvm-cov (≥95% lines/regions; nightly --branch)'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'assay-coverage'
    inputs:
      - 'rust/tools/assay/src/**/*'
      - 'rust/tools/assay/Cargo.toml'
      - 'rust/tools/nixq/src/**/*'
      - 'rust/tools/nixq/Cargo.toml'
      - 'rust/tools/nixdrv/src/**/*'
      - 'rust/tools/nixdrv/Cargo.toml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
    options:
      cache: true
  nixq-test:
    description: 'nixq unit tests'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'cargo'
      - 'test'
      - '--manifest-path'
      - 'rust/Cargo.toml'
      - '-p'
      - 'nixq'
    inputs:
      - 'rust/tools/nixq/src/**/*'
      - 'rust/tools/nixq/Cargo.toml'
      - 'rust/tools/nixdrv/src/**/*'
      - 'rust/tools/nixdrv/Cargo.toml'
      - 'rust/Cargo.toml'
    options:
      cache: true
  nixq-coverage:
    description: 'nixq crate llvm-cov (≥95% lines/regions; nightly --branch)'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'nixq-coverage'
    inputs:
      - 'rust/tools/nixq/src/**/*'
      - 'rust/tools/nixq/Cargo.toml'
      - 'rust/tools/nixdrv/src/**/*'
      - 'rust/tools/nixdrv/Cargo.toml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
    options:
      cache: true
  nixdrv-test:
    description: 'nixdrv unit tests'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'cargo'
      - 'test'
      - '--manifest-path'
      - 'rust/Cargo.toml'
      - '-p'
      - 'nixdrv'
    inputs:
      - 'rust/tools/nixdrv/src/**/*'
      - 'rust/tools/nixdrv/Cargo.toml'
      - 'rust/tools/nixq/src/**/*'
      - 'rust/tools/nixq/Cargo.toml'
      - 'rust/tools/nixdrv/src/**/*'
      - 'rust/tools/nixdrv/Cargo.toml'
      - 'rust/Cargo.toml'
    options:
      cache: true
  nixdrv-coverage:
    description: 'nixdrv crate llvm-cov (≥95% lines/regions; nightly --branch)'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'nixdrv-coverage'
    inputs:
      - 'rust/tools/nixdrv/src/**/*'
      - 'rust/tools/nixdrv/Cargo.toml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
    options:
      cache: true
  nixstore-test:
    description: nixstore unit tests
    command: devenv
    args:
      - shell
      - --
      - cargo
      - test
      - --manifest-path
      - rust/Cargo.toml
      - -p
      - nixstore
    inputs:
      - rust/tools/nixstore/src/**/*
      - rust/tools/nixstore/Cargo.toml
      - rust/tools/nixstore/fixtures/**/*
      - rust/Cargo.toml
    options:
      cache: true
  nixstore-coverage:
    description: nixstore crate llvm-cov
    command: devenv
    args:
      - shell
      - --
      - nixstore-coverage
    inputs:
      - rust/tools/nixstore/src/**/*
      - rust/tools/nixstore/Cargo.toml
      - rust/Cargo.toml
      - rust/Cargo.lock
    options:
      cache: true

