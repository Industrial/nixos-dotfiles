$schema: 'https://moonrepo.dev/schemas/project.json'
id: 'dotfiles'
language: 'bash'
tasks:
  format:
    command: 'treefmt'
  test:
    description: 'Run Assay on all *.assay.nix suites across the repository'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'assay'
      - 'run'
      - '.'
    inputs:
      - '**/*.assay.nix'
      - '**/*.assay.json'
      - 'common/assay/**/*'
      - 'common/**/*.nix'
    options:
      # Whole-repo discovery; do not treat as always-cacheable across env changes.
      cache: true
  stig-vm-test:
    description: 'Boot a VM per STIG control and verify the running system (Anduril NixOS STIG)'
    command: 'devenv'
    args:
      - 'shell'
      - '--'
      - 'bin/stig-vm-test'
    inputs:
      - 'features/security/stig/**/*'
      - 'bin/stig-vm-test'
    options:
      # VM tests boot real machines; never assume a cached pass across env changes.
      cache: true
