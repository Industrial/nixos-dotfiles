$schema: 'https://moonrepo.dev/schemas/project.json'
id: 'dotfiles'
language: 'bash'
# Every task is a thin call into bin/dev, the repo's one entry point (`bin/dev`
# with no arguments lists the commands). Arguments after `--` pass through:
#   moon run dotfiles:test -- nushell
#   moon run dotfiles:eval -- mimir
#   moon run dotfiles:check -- --host mimir
tasks:
  check:
    description: 'Mirror .github/workflows/ci.yml locally (format, lints, assay); builds no host. bin/dev check'
    command: 'bin/dev'
    args:
      - 'check'
    options:
      # Reads the working tree, git state and the network; a cached pass means nothing.
      cache: false
  format:
    description: 'Format the tree with treefmt (writes). bin/dev format'
    command: 'bin/dev'
    args:
      - 'format'
    options:
      cache: false
  lint:
    description: 'deadnix, feature-reachability, lint-fetch-pins, assay coverage and source-match. bin/dev lint'
    command: 'bin/dev'
    args:
      - 'lint'
    options:
      cache: false
  eval:
    description: "Evaluate one host's system derivation without building it. bin/dev eval <host>"
    command: 'bin/dev'
    args:
      - 'eval'
    options:
      cache: false
  test:
    description: 'Run Assay on all git-tracked *.assay.nix suites (bin/assay-run-tracked). bin/dev test [target]'
    command: 'bin/dev'
    args:
      - 'test'
    inputs:
      - '**/*.assay.nix'
      - '**/*.assay.json'
      - 'common/assay/**/*'
      # Suites evaluate the modules they cover (common/assay/nixos.nix), so any module
      # edit — and any nixpkgs bump — must invalidate the cached result.
      - '**/*.nix'
      - 'flake.lock'
      - 'bin/assay-run-tracked'
      - 'bin/dev'
    options:
      # Whole-repo discovery; do not treat as always-cacheable across env changes.
      cache: true
  stig-vm-test:
    description: 'Boot a VM per STIG control and verify the running system (Anduril NixOS STIG)'
    command: 'bin/with-devenv'
    args:
      - 'bin/stig-vm-test'
    inputs:
      - 'features/security/stig/**/*'
      - 'bin/stig-vm-test'
    options:
      # VM tests boot real machines; never assume a cached pass across env changes.
      cache: true
