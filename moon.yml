$schema: 'https://moonrepo.dev/schemas/project.json'
id: 'dotfiles'
language: 'bash'
tasks:
  format:
    command: 'treefmt'
  test:
    description: 'Run Assay on all git-tracked *.assay.nix suites across the repository'
    command: 'bin/with-devenv'
    args:
      - 'bin/assay-run-tracked'
    inputs:
      - '**/*.assay.nix'
      - '**/*.assay.json'
      - 'common/assay/**/*'
      # Suites evaluate the modules they cover (common/assay/nixos.nix), so any module
      # edit — and any nixpkgs bump — must invalidate the cached result.
      - '**/*.nix'
      - 'flake.lock'
      - 'bin/assay-run-tracked'
    options:
      # Whole-repo discovery; do not treat as always-cacheable across env changes.
      cache: true
  stig-vm-test:
    description: 'Boot a VM per STIG control and verify the running system (Anduril NixOS STIG)'
    command: 'bin/with-devenv'
    args:
      - 'bin/stig-vm-test'
    inputs:
      - 'features/security/stig/**/*'
      - 'bin/stig-vm-test'
    options:
      # VM tests boot real machines; never assume a cached pass across env changes.
      cache: true
