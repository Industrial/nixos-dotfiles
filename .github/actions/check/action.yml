name: 'Check'
description: 'Evaluate one nixosConfiguration and dry-run its build'
inputs:
  host:
    description: 'nixosConfigurations attribute to check'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Evaluate and dry-run build
      shell: bash
      env:
        HOST: ${{ inputs.host }}
      run: ./bin/ci/check-host "$HOST"
