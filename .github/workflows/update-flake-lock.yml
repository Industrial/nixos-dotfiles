# Scheduled flake.lock bumps, opened as pull requests for the operator to review.
#
# Policy: docs/adr/0006-update-policy.md. Procedure: docs/runbooks/updates.md.
#
# The updater is vbump (rust/tools/vbump, GH-189), one pull request per input:
#
#   vbump   for each root input on its own: `nix flake update <input>`, evaluate and
#           dry-build every nixosConfigurations host against that lock, diff each host's
#           derivation closure against main (vdiff --json), and open or refresh the PR on
#           `update/flake-lock-<input>`. One input failing (it does not evaluate, a host
#           does not dry-build) fails only that input; the job goes red at the end.
#
# Rollback: the repository variable FLAKE_LOCK_UPDATER=legacy (scheduled runs), or the
# `updater: legacy` dispatch input, runs the previous single all-inputs PR instead:
#
#   lock    bumps every root input and opens or refreshes ONE PR on `update/flake-lock`.
#   hosts   lists nixosConfigurations from the bumped flake (same source as ci.yml).
#   diff    per host: evaluates the package diff against main. No build.
#   report  writes the input table and the per-host package diff into the PR body.
#
# Selector (both jobs read the same expression; default vbump):
#   inputs.updater || vars.FLAKE_LOCK_UPDATER || 'vbump'
#
# Host checks are NOT duplicated here. The bump PR runs the regular PR workflow (pr.yml ->
# ci.yml), and `ci / all-green` is the required check on main. GitHub only starts that
# workflow for a PR that a workflow opened when the PR was opened with a token other than
# GITHUB_TOKEN. The vbump job mints one per run from the vbump GitHub App (secrets
# VBUMP_APP_ID and VBUMP_APP_PRIVATE_KEY; setup in docs/runbooks/updates.md); without
# them it falls back to FLAKE_LOCK_UPDATE_TOKEN, then GITHUB_TOKEN, with a warning, and a
# person has to close and reopen each PR before `ci / all-green` can run. The legacy job
# reads FLAKE_LOCK_UPDATE_TOKEN only.
#
# This workflow NEVER merges, approves or enables auto-merge. Hosts change only after the
# operator merges the PR into main, when comin (ADR-0002) converges them.
name: Update flake.lock
on:
  schedule:
    # Mondays 03:23 UTC: off the hour, and a full week of upstream churn per review.
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      updater:
        description: 'vbump: one PR per input (default). legacy: the old single all-inputs PR'
        type: choice
        options: [vbump, legacy]
        default: vbump
      input:
        description: 'vbump only: bump just this root input (empty: every input)'
        type: string
        default: ''
permissions: {}
concurrency:
  group: update-flake-lock
  cancel-in-progress: false
env:
  LOCK_BRANCH: update/flake-lock
jobs:
  vbump:
    name: Bump each input (vbump)
    # Lock bumps are always against main: the PR base is whatever branch is checked out.
    if: github.ref == 'refs/heads/main' && (inputs.updater || vars.FLAKE_LOCK_UPDATER || 'vbump') == 'vbump'
    runs-on: ubuntu-latest
    # Every input evaluates every host (about 20 s and 3 GB each), two inputs at a time.
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      # Labels are an issues API: vbump creates `flake-lock` when missing and adds it.
      issues: write
    env:
      INPUT: ${{ inputs.input }}
      # The vbump GitHub App (VBUMP_APP_ID: its Client ID or App ID; VBUMP_APP_PRIVATE_KEY:
      # a private key it generated). Both set: each run mints a short-lived installation
      # token scoped to this repository. Either missing: the job runs as before, with
      # FLAKE_LOCK_UPDATE_TOKEN or GITHUB_TOKEN, and says so in the job summary.
      HAS_APP: ${{ secrets.VBUMP_APP_ID != '' && secrets.VBUMP_APP_PRIVATE_KEY != '' }}
    steps:
      # Why a token other than GITHUB_TOKEN: GitHub starts no workflow for a PR that
      # GITHUB_TOKEN opened, so `ci / all-green` (required on main) would never run on a
      # bump PR until someone closed and reopened it. See ADR-0006.
      - name: Mint the vbump app token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.VBUMP_APP_ID }}
          private-key: ${{ secrets.VBUMP_APP_PRIVATE_KEY }}
          # No owner/repositories: the token is scoped to this repository alone. The
          # permissions narrow it further, to what vbump uses.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Without the app, say so
        if: env.HAS_APP != 'true'
        run: |
          msg='VBUMP_APP_ID / VBUMP_APP_PRIVATE_KEY are not set: the bump PRs are opened with FLAKE_LOCK_UPDATE_TOKEN or GITHUB_TOKEN. With GITHUB_TOKEN their CI does not start until each PR is closed and reopened (docs/runbooks/updates.md).'
          echo "::warning title=vbump without its app token::$msg"
          printf '> [!WARNING]\n> %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
      # vbump pushes each input's branch from this checkout, so it keeps the credentials
      # (the same token the PRs are opened with). The legacy job's action did the same.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || secrets.FLAKE_LOCK_UPDATE_TOKEN || github.token }}
          persist-credentials: true
      # The commits are the app's bot user's when the app token is in use.
      - name: Committer
        id: committer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [ -n "$SLUG" ]; then
            id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
            echo "identity=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
          else
            echo "identity=github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      # The crate's default.nix through the flake's nixpkgs, as the fleet builds it.
      - name: Build vbump
        run: |
          set -euo pipefail
          out="$(nix build --no-link --print-out-paths --impure --expr \
            "(builtins.getFlake \"git+file://$PWD?shallow=1&rev=$GITHUB_SHA\").inputs.nixpkgs.legacyPackages.x86_64-linux.callPackage $PWD/rust/tools/vbump {}")"
          echo "$out/bin" >> "$GITHUB_PATH"
      - name: Bump each input
        env:
          # gh (PR create/edit, the label) uses the same token as the push.
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.FLAKE_LOCK_UPDATE_TOKEN || github.token }}
          COMMITTER: ${{ steps.committer.outputs.identity }}
        run: |
          set -euo pipefail
          args=(run --rev "$GITHUB_SHA" --jobs 2 --out vbump-out --summary "$GITHUB_STEP_SUMMARY"
            --committer "$COMMITTER")
          if [ -n "$INPUT" ]; then args+=(--input "$INPUT"); fi
          vbump "${args[@]}"
      - name: Upload proposals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vbump-proposals
          path: vbump-out
          if-no-files-found: ignore
          retention-days: 14
  lock:
    name: Bump flake.lock (legacy)
    # Lock bumps are always against main: the PR base is whatever branch is checked out.
    # The rollback path: only when the selector says legacy.
    if: github.ref == 'refs/heads/main' && (inputs.updater || vars.FLAKE_LOCK_UPDATER || 'vbump') == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.update.outputs.pull-request-number }}
      operation: ${{ steps.update.outputs.pull-request-operation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Update flake.lock and open PR
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ secrets.FLAKE_LOCK_UPDATE_TOKEN || github.token }}
          branch: ${{ env.LOCK_BRANCH }}
          commit-msg: 'chore(flake): bump flake.lock'
          pr-title: 'chore(flake): bump flake.lock'
          pr-labels: flake-lock
          pr-body: |
            Scheduled lock bump from `.github/workflows/update-flake-lock.yml`. **Review and merge by hand**: nothing merges this automatically, and no host changes until it lands on `main` (comin then converges every host within ~5 minutes; see `docs/runbooks/updates.md`).

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            <!-- update-flake-lock:diff:start -->
            _Per-host package diff pending: this workflow's `report` job fills it in._
            <!-- update-flake-lock:diff:end -->

            ### Review checklist

            - [ ] `ci / all-green` passed. If no `PR` checks started, close and reopen this PR: it was opened without `FLAKE_LOCK_UPDATE_TOKEN`
            - [ ] the kernel and NixOS moves above are expected; a kernel move needs a reboot after convergence
            - [ ] no removed package that a host still needs
  hosts:
    name: List hosts
    needs: lock
    if: needs.lock.outputs.pr != '' && needs.lock.outputs.operation != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Checkout lock-bump branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LOCK_BRANCH }}
          persist-credentials: false
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: List nixosConfigurations
        id: list
        run: |
          names="$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)"
          echo "nixosConfigurations: $names"
          echo "names=$names" >>"$GITHUB_OUTPUT"
  diff:
    name: Diff (${{ matrix.host }})
    needs: [lock, hosts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.names) }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - name: Checkout lock-bump branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LOCK_BRANCH }}
          persist-credentials: false
      # Untracked inside the head checkout, so neither flake ever sees the other.
      - name: Checkout base (main as the bump saw it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .update-base
          persist-credentials: false
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Package diff
        run: |
          set -euo pipefail
          mkdir -p out
          if ! bin/update/pkg-diff host "$PWD/.update-base" "$PWD" "$HOST" 120 > "out/$HOST.md" 2> err.log; then
            {
              echo "### $HOST"
              echo
              echo "**Evaluation failed** -- this bump does not evaluate for $HOST. Last lines:"
              echo
              echo '```'
              tail -n 20 err.log
              echo '```'
            } > "out/$HOST.md"
            echo "pkg-diff failed for $HOST" >&2
            failed=1
          fi
          # Upload the markdown either way; fail the job afterwards so the run is red.
          echo "failed=${failed:-0}" >> "$GITHUB_ENV"
      - name: Upload diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-diff-${{ matrix.host }}
          path: out/${{ matrix.host }}.md
          retention-days: 14
      - name: Fail on a failed evaluation
        if: env.failed == '1'
        run: exit 1
  report:
    name: Write diff into PR body
    needs: [lock, hosts, diff]
    if: always() && needs.lock.outputs.pr != '' && needs.lock.outputs.operation != 'closed' && needs.hosts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ needs.lock.outputs.pr }}
      HOSTS: ${{ needs.hosts.outputs.names }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout lock-bump branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LOCK_BRANCH }}
          persist-credentials: false
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .update-base
          persist-credentials: false
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Download diffs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-diff-*
          merge-multiple: true
          path: diffs
      - name: Assemble and write PR body
        run: |
          set -euo pipefail
          {
            echo '## What this bump changes'
            echo
            echo "Base: \`${GITHUB_SHA:0:12}\` (main). Package versions are **evaluated, not built**: \`environment.systemPackages\`, kernel and NixOS release per host. The exact built closure diff appears on each host after merge (\`nixos-update-notifier\`, \`nix store diff-closures\`)."
            echo
            echo '### Flake inputs'
            echo
            bin/update/pkg-diff inputs "$PWD/.update-base" "$PWD"
            echo
            for host in $(jq -r '.[]' <<<"$HOSTS"); do
              if [ -f "diffs/$host.md" ]; then
                cat "diffs/$host.md"
              else
                printf '### %s\n\n_No diff: the job for this host did not produce one; see the workflow run._\n' "$host"
              fi
              echo
            done
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > section.md
          gh pr view "$PR" --json body --jq .body > body.md
          start='<!-- update-flake-lock:diff:start -->'
          end='<!-- update-flake-lock:diff:end -->'
          if grep -qF "$start" body.md && grep -qF "$end" body.md; then
            awk -v start="$start" -v end="$end" -v f=section.md '
              $0 == start { print; while ((getline l < f) > 0) print l; skip = 1; next }
              $0 == end { skip = 0 }
              !skip { print }
            ' body.md > new.md
          else
            { cat body.md; echo; echo "$start"; cat section.md; echo "$end"; } > new.md
          fi
          gh pr edit "$PR" --body-file new.md
