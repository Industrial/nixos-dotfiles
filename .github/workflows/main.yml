name: Main
on:
  push:
    branches:
      - main
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: Format Check
        uses: ./.github/actions/format
  clamav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: ClamAV Scan
        uses: ./.github/actions/clamav
  lynis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: Lynis Scan
        uses: ./.github/actions/lynis
  deadnix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: Dead Code Detection
        uses: ./.github/actions/deadnix
  feature-reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: Feature Reachability
        uses: ./.github/actions/feature-reachability
  lint-fetch-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: Fetch Pin Lint
        uses: ./.github/actions/lint-fetch-pins
  assay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: Assay
        uses: ./.github/actions/assay
  shell-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      # Same gate as the pull request workflow, and deliberately not a stricter one: the
      # budget is a ratio measured on the runner it runs on, so there is nothing for main
      # to tighten. What main adds is a continuous series of the measurement.
      - name: Shell startup budget
        uses: ./.github/actions/shell-budget
  stig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      # On main, also boot a VM per control. This is the only gate that proves the runtime
      # half of the baseline -- the controls whose requirement no amount of static analysis
      # can speak to.
      - name: STIG compliance
        uses: ./.github/actions/stig
        with:
          vm-tests: 'true'
  cargo-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-nix
      - name: Clippy
        run: nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#clippy -c bash -c "cd rust && cargo clippy --workspace --all-targets -- -D warnings"
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-nix
      - name: Test
        run: nix shell nixpkgs#cargo nixpkgs#rustc -c bash -c "cd rust && cargo test --workspace"
  cargo-nix-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-nix
      - name: Check Cargo.nix drift
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc -c bash -c "cd rust && cargo generate-lockfile"
          # Check if any Cargo.nix files would change
          git diff --exit-code rust/tools/*/Cargo.nix || (echo 'Cargo.nix is out of date. Run cargo regenerate-lockfile and commit.' && exit 1)
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [drakkar, huginn, mimir]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Nix and Cachix
        uses: ./.github/actions/setup-nix
      - name: Check
        uses: ./.github/actions/check
        with:
          host: ${{ matrix.host }}
