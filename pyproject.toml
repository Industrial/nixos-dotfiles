# Minimal Python workspace: devenv `uv sync` installs the Serena MCP CLI into
# `.devenv/state/venv/bin` (see `devenv.nix` languages.python.uv.sync).
[project]
name = "dotfiles-venv"
version = "0.0.0"
description = "Devenv uv anchor for Serena MCP (dependency-groups only)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[dependency-groups]
serena = ["serena-agent>=1.5.3"]
